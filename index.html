<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="VB Score">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231a1a1a'/%3E%3Ctext y='75' x='10' font-family='Arial' font-size='70' fill='yellow'%3EVB%3C/text%3E%3C/svg%3E">
    <title>バレーボール・スコア記録</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@700&display=swap');

        :root {
            --bg-color: #1a1a1a;
            --text-color: #ffffff;
            --color-a: #eab308;
            --color-b: #ffffff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Roboto Mono', monospace;
            overflow: hidden;
            touch-action: manipulation;
        }

        .score-display {
            font-size: 28vh;
            line-height: 0.85;
            font-variant-numeric: tabular-nums;
            text-align: center;
            width: 100%;
        }

        @media (orientation: landscape) {
            .score-display {
                font-size: 50vh;
            }
        }

        .tap-area {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .team-name {
            font-size: 2rem;
            text-transform: uppercase;
        }

        .timeline-container {
            scrollbar-width: thin;
            scrollbar-color: #555 #222;
        }

        * {
            touch-action: manipulation;
        }

        .color-box {
            color: #000;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .color-box.t-box {
            border-radius: 50%;
        }
        /* Color picker input styling */
        input[type="color"] {
            -webkit-appearance: none;
            border: none;
        }
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 4px;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col">

    <!-- Header / Nav -->
    <header class="h-12 flex items-center justify-between px-4 bg-zinc-900 border-b border-zinc-800 z-50">
        <button onclick="toggleSettings()" class="text-zinc-400">⚙️</button>
        <div id="match-info" class="text-xs text-zinc-500 font-bold tracking-widest flex items-center gap-2">
            <span>第<span id="current-set-num">1</span>セット</span>
            <span>|</span>
            <span>⏱️ <span id="match-duration">0</span>分</span>
        </div>
        <button onclick="toggleHistory()" class="text-zinc-400">📋</button>
    </header>

    <!-- Main Score Area -->
    <main id="main-court" class="flex-1 flex flex-col landscape:flex-row relative">
        <!-- Team A -->
        <div id="area-a" class="flex-1 basis-0 min-w-0 min-h-0 overflow-hidden flex flex-col items-center justify-center tap-area relative w-full" onclick="addPoint('A')">
            <div id="to-indicator-a" class="flex gap-3 mb-3 pointer-events-auto cursor-pointer relative z-50 p-2 -m-2 select-none" onclick="event.stopPropagation(); requestTimeout('A');" title="タイムアウトを取る">
                <!-- Timeouts drawn here -->
            </div>
            <div class="flex items-center justify-center gap-2 mb-2 w-full px-4">
                <button onclick="event.stopPropagation(); toggleCourtOverlay('A');" class="pointer-events-auto relative z-50 w-12 h-10 flex items-center justify-center text-xl bg-zinc-800/80 rounded text-zinc-400 shrink-0 hover:bg-zinc-700 active:scale-95 transition-all" title="コート図 / 交代">🏟️</button>
                <div id="serve-indicator-a" onclick="event.stopPropagation(); toggleServingTeam();" class="pointer-events-auto relative z-50 text-2xl select-none cursor-pointer shrink-0 hover:scale-125 transition-transform" title="タップしてサーブ権移動"></div>
                <div id="name-a" onclick="event.stopPropagation(); openTeamConfigModal('A');" class="pointer-events-auto relative z-50 team-name truncate text-center cursor-pointer hover:underline select-none" title="チーム設定を変更" style="color: var(--color-a);">TEAM A</div>
                <div id="sets-a" class="w-14 h-12 flex items-center justify-center text-3xl font-black bg-zinc-800/90 rounded text-yellow-400 shrink-0 shadow-inner">0</div>
            </div>
            <div id="score-a" class="score-display font-bold" style="color: var(--color-a);">00</div>
        </div>

        <!-- Team B -->
        <div id="area-b" class="flex-1 basis-0 min-w-0 min-h-0 overflow-hidden flex flex-col items-center justify-center tap-area relative w-full" onclick="addPoint('B')">
            <div id="to-indicator-b" class="flex gap-3 mb-3 pointer-events-auto cursor-pointer relative z-50 p-2 -m-2 select-none" onclick="event.stopPropagation(); requestTimeout('B');" title="タイムアウトを取る">
                <!-- Timeouts drawn here -->
            </div>
            <div class="flex items-center justify-center gap-2 mb-2 w-full px-4">
                <button onclick="event.stopPropagation(); toggleCourtOverlay('B');" class="pointer-events-auto relative z-50 w-12 h-10 flex items-center justify-center text-xl bg-zinc-800/80 rounded text-zinc-400 shrink-0 hover:bg-zinc-700 active:scale-95 transition-all" title="コート図 / 交代">🏟️</button>
                <div id="serve-indicator-b" onclick="event.stopPropagation(); toggleServingTeam();" class="pointer-events-auto relative z-50 text-2xl select-none cursor-pointer shrink-0 hover:scale-125 transition-transform" title="タップしてサーブ権移動"></div>
                <div id="name-b" onclick="event.stopPropagation(); openTeamConfigModal('B');" class="pointer-events-auto relative z-50 team-name truncate text-center cursor-pointer hover:underline select-none" title="チーム設定を変更" style="color: var(--color-b);">TEAM B</div>
                <div id="sets-b" class="w-14 h-12 flex items-center justify-center text-3xl font-black bg-zinc-800/90 rounded text-yellow-400 shrink-0 shadow-inner">0</div>
            </div>
            <div id="score-b" class="score-display font-bold" style="color: var(--color-b);">00</div>
        </div>

        <!-- Float Controls -->
        <div class="absolute inset-0 pointer-events-none flex items-center justify-center z-40">
            <div class="pointer-events-auto flex landscape:flex-col portrait:flex-row gap-8 items-center">
                <button onclick="event.stopPropagation(); undo();" class="bg-transparent hover:scale-125 transition-transform p-2 text-4xl drop-shadow-xl" title="1つ戻す">↩️</button>
                <button onclick="event.stopPropagation(); swapCourts();" class="bg-transparent hover:scale-125 transition-transform p-2 text-4xl drop-shadow-xl" title="コートチェンジ">↔️</button>
                <button onclick="event.stopPropagation(); showCurrentTimeline();" class="bg-transparent hover:scale-125 transition-transform p-2 text-4xl drop-shadow-xl" title="タイムライン">📊</button>
                <button onclick="event.stopPropagation(); toggleResetMenu();" class="bg-transparent hover:scale-125 transition-transform p-2 text-4xl drop-shadow-xl" title="終了 / リセット">🔄</button>
            </div>
        </div>
    </main>

    <!-- Modals -->
    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-black/90 z-[100] hidden p-6 overflow-y-auto">
        <div class="max-w-md mx-auto">
            <h2 class="text-2xl font-bold mb-6 border-b border-zinc-700 pb-2 text-yellow-400">設定</h2>
            
            <div class="space-y-6">
                <div>
                    <button onclick="event.stopPropagation(); openMasterTeamModal();" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded flex items-center justify-center gap-2 shadow">
                        👤 チーム・メンバーの管理（マスター登録）
                    </button>
                </div>

                <!-- 最初のサーブ権設定は得点画面のサーブ権インジケーター等で直接コントロールするため削除 -->

                <div>
                    <label class="block text-xs font-bold text-zinc-500 mb-1">試合形式</label>
                    <select id="input-sets-format" class="w-full bg-zinc-800 border-none p-2 text-white">
                        <option value="1">1セットマッチ</option>
                        <option value="3" selected>3セットマッチ</option>
                        <option value="5">5セットマッチ</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-zinc-500 mb-1">1セットのタイムアウト可能回数</label>
                    <input type="number" id="input-max-timeouts" class="w-full bg-zinc-800 border-none p-2 text-white" value="2" min="0" max="10">
                </div>

                <div>
                    <label class="block text-xs font-bold text-zinc-500 mb-1">タイムアウト時間（秒）</label>
                    <input type="number" id="input-timeout-duration" class="w-full bg-zinc-800 border-none p-2 text-white" value="30" min="5" max="180">
                </div>

                <div>
                    <label class="block text-xs font-bold text-zinc-500 mb-1">1セットの目標点数</label>
                    <input type="number" id="input-target-points" class="w-full bg-zinc-800 border-none p-2 text-white" value="25">
                </div>

                <div>
                    <label class="block text-xs font-bold text-zinc-500 mb-1">最終セットの目標点数</label>
                    <input type="number" id="input-final-set-target" class="w-full bg-zinc-800 border-none p-2 text-white" value="15">
                </div>

                <div class="flex gap-4 pt-6">
                    <button onclick="event.stopPropagation(); applySettings();" class="flex-1 bg-zinc-700 hover:bg-zinc-600 text-white font-bold py-3 rounded">設定を保存</button>
                    <button onclick="event.stopPropagation(); toggleSettings();" class="flex-1 bg-zinc-800 hover:bg-zinc-700 text-white font-bold py-3 rounded">閉じる</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Reset Modal -->
    <div id="reset-modal" class="fixed inset-0 bg-black/90 z-[150] hidden p-6 flex flex-col items-center justify-center">
        <div class="max-w-sm w-full bg-zinc-900 border border-zinc-800 p-6 rounded-lg text-center shadow-2xl">
            <h2 class="text-xl font-bold mb-6 text-white">試合メニュー</h2>
            <div class="space-y-4">
                <button onclick="finishAndStartNewMatch()" class="w-full bg-yellow-500 hover:bg-yellow-400 text-black font-bold py-4 rounded shadow-lg text-sm">
                    試合を終了・記録して新しく始める
                </button>
                <button onclick="startNewMatch()" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-4 rounded shadow-lg text-sm">
                    記録せずにリセットする (最初から)
                </button>
                <button onclick="toggleResetMenu()" class="w-full bg-zinc-700 hover:bg-zinc-600 text-white font-bold py-4 rounded shadow-lg text-sm mt-4">
                    キャンセル
                </button>
            </div>
        </div>
    </div>

    <!-- Timeline Modal -->
    <div id="timeline-modal" class="fixed inset-0 bg-[#1a1a1a] z-[100] hidden p-4 overflow-hidden flex flex-col">
        <div class="flex justify-between items-center mb-4 shrink-0">
            <h2 class="text-2xl font-bold text-white">タイムライン</h2>
            <div class="flex gap-2">
                <button onclick="shareTimelineAsImage('timeline-content')" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded text-sm text-white font-bold">📤 画像で共有</button>
                <button onclick="toggleTimeline()" class="bg-zinc-700 px-4 py-2 rounded text-sm text-white">閉じる</button>
            </div>
        </div>
        <div id="timeline-content" class="flex-1 overflow-y-auto timeline-container text-white px-2 bg-[#1a1a1a]">
            <!-- Timeline rendering here -->
        </div>
    </div>

    <!-- History Modal -->
    <div id="history-modal" class="fixed inset-0 bg-black/95 z-[100] hidden p-4 overflow-hidden flex flex-col">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-2xl font-bold text-yellow-400">試合履歴</h2>
            <button onclick="toggleHistory()" class="bg-zinc-700 px-4 py-2 rounded text-sm">閉じる</button>
        </div>
        <div id="history-list" class="flex-1 overflow-y-auto">
            <!-- History items here -->
        </div>
        <button onclick="clearHistory()" class="mt-4 text-xs text-red-500">すべての履歴を削除</button>
    </div>

    <!-- Member Modal -->
    <!-- Team Config Modal (得点画面のチーム名クリックから呼び出し) -->
    <div id="team-config-modal" class="fixed inset-0 bg-black/90 z-[160] hidden p-6 overflow-y-auto">
        <div class="max-w-md mx-auto bg-zinc-900 border border-zinc-800 p-6 rounded-lg shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h2 id="team-config-title" class="text-xl font-bold text-yellow-400">チーム設定</h2>
                <button onclick="event.stopPropagation(); closeTeamConfigModal();" class="text-zinc-500 hover:text-white text-xl">✕</button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-zinc-400 mb-1">既存のチーム（プリセット）から選択</label>
                    <select id="config-preset-select" onchange="onConfigPresetChange(this.value)" class="w-full bg-zinc-800 border-none p-2 text-white rounded cursor-pointer">
                        <option value="">選択しない（一時的な新規入力）</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-zinc-500 mb-1">チーム名</label>
                    <input type="text" id="config-team-name" class="w-full bg-zinc-800 border-none p-2 text-white rounded font-bold" placeholder="チーム名">
                </div>
                <div>
                    <label class="block text-xs font-bold text-zinc-500 mb-1">チームカラー</label>
                    <div class="flex items-center gap-2">
                        <input type="color" id="config-team-color" class="w-12 h-10 bg-zinc-800 border-none cursor-pointer rounded">
                        <span class="text-xs text-zinc-400">表示カラー</span>
                    </div>
                </div>
            </div>
            <div class="mt-8 pt-4 border-t border-zinc-800 flex gap-3">
                <button onclick="event.stopPropagation(); applyTeamConfig();" class="flex-1 bg-yellow-500 hover:bg-yellow-400 text-black font-bold py-3 rounded shadow">
                    適用する
                </button>
                <button onclick="event.stopPropagation(); closeTeamConfigModal();" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-bold px-4 py-3 rounded">
                    キャンセル
                </button>
            </div>
        </div>
    </div>

    <!-- Master Team Modal (マスターデータ管理用・設定画面から呼び出し) -->
    <div id="member-modal" class="fixed inset-0 bg-black/90 z-[160] hidden p-6 overflow-y-auto">
        <div class="max-w-md mx-auto flex flex-col h-full bg-zinc-900 border border-zinc-800 p-6 rounded-lg shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-blue-400">チームマスター管理</h2>
                <button onclick="event.stopPropagation(); toggleMembers();" class="text-zinc-500 hover:text-white text-xl">✕</button>
            </div>

            <div class="mb-6 bg-zinc-950 p-3 rounded border border-zinc-800">
                <label class="block text-xs font-bold text-zinc-400 mb-1">編集する保存済みチームを選択</label>
                <select id="master-team-select" onchange="loadMasterTeamForEdit(this.value)" class="w-full bg-zinc-800 border-none p-2 text-white rounded cursor-pointer">
                    <option value="">-- 新規チームを作成 --</option>
                </select>
            </div>

            <div class="flex-1 space-y-4">
                <div>
                    <label class="block text-xs font-bold text-zinc-500 mb-1">チーム名</label>
                    <input type="text" id="master-team-name" class="w-full bg-zinc-800 border-none p-2 text-white rounded font-bold" placeholder="チーム名">
                </div>
                <div>
                    <label class="block text-xs font-bold text-zinc-500 mb-1">チームカラー</label>
                    <div class="flex items-center gap-2">
                        <input type="color" id="master-team-color" class="w-12 h-10 bg-zinc-800 border-none cursor-pointer rounded">
                        <span class="text-xs text-zinc-400">ユニフォーム・メインカラー</span>
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-2 mt-4">
                        <label class="block text-xs font-bold text-zinc-500">登録選手リスト</label>
                    </div>
                    <div id="master-member-list" class="space-y-2 max-h-60 overflow-y-auto pr-1">
                        <!-- JS Rendered -->
                    </div>
                </div>
            </div>

            <div class="mt-8 pt-4 border-t border-zinc-800 flex gap-3">
                <button onclick="event.stopPropagation(); saveMasterTeam();" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded shadow">
                    💾 プリセットを保存
                </button>
                <button onclick="event.stopPropagation(); deleteMasterTeam();" class="bg-zinc-800 hover:bg-red-950 hover:text-red-400 text-zinc-500 px-4 py-3 rounded" title="このチームを削除">
                    🗑️ 削除
                </button>
            </div>
        </div>
    </div>

    <!-- Court Overlay Modal -->
    <div id="court-modal" class="fixed inset-0 bg-black/90 z-[170] hidden p-6 flex flex-col items-center justify-center">
        <div class="max-w-md w-full flex flex-col h-full max-h-[80vh]">
            <div class="flex justify-between items-center mb-6">
                <h2 id="court-team-label" class="text-2xl font-bold text-white">TEAM A</h2>
                <button onclick="toggleCourtOverlay()" class="bg-zinc-700 px-4 py-2 rounded text-sm text-white">閉じる</button>
            </div>
            
            <!-- Court Grid -->
            <div id="court-grid-container" class="flex-1 flex gap-2 bg-emerald-800 p-4 rounded-lg border-4 border-white/20 relative aspect-[3/2] w-full max-w-sm mx-auto shadow-2xl transition-all duration-300">
                <!-- Front Row (P4, P3, P2) -->
                <div id="court-front-row" class="flex-1 flex gap-2 transition-all duration-300">
                    <div id="pos-4" onclick="openSubModal(3)" class="flex-1 bg-white/10 rounded flex flex-col items-center justify-center border border-white/20 active:bg-white/30 transition-colors">
                        <span class="text-xs text-white/50 font-bold mb-1">P4</span>
                        <span class="text-3xl font-bold text-white player-num">-</span>
                    </div>
                    <div id="pos-3" onclick="openSubModal(2)" class="flex-1 bg-white/10 rounded flex flex-col items-center justify-center border border-white/20 active:bg-white/30 transition-colors">
                        <span class="text-xs text-white/50 font-bold mb-1">P3</span>
                        <span class="text-3xl font-bold text-white player-num">-</span>
                    </div>
                    <div id="pos-2" onclick="openSubModal(1)" class="flex-1 bg-white/10 rounded flex flex-col items-center justify-center border border-white/20 active:bg-white/30 transition-colors">
                        <span class="text-xs text-white/50 font-bold mb-1">P2</span>
                        <span class="text-3xl font-bold text-white player-num">-</span>
                    </div>
                </div>
                <!-- Net Line -->
                <div id="court-net-line" class="bg-white/30 transition-all duration-300 shrink-0"></div>
                <!-- Back Row (P5, P6, P1) -->
                <div id="court-back-row" class="flex-1 flex gap-2 transition-all duration-300">
                    <div id="pos-5" onclick="openSubModal(4)" class="flex-1 bg-white/10 rounded flex flex-col items-center justify-center border border-white/20 active:bg-white/30 transition-colors">
                        <span class="text-xs text-white/50 font-bold mb-1">P5</span>
                        <span class="text-3xl font-bold text-white player-num">-</span>
                    </div>
                    <div id="pos-6" onclick="openSubModal(5)" class="flex-1 bg-white/10 rounded flex flex-col items-center justify-center border border-white/20 active:bg-white/30 transition-colors">
                        <span class="text-xs text-white/50 font-bold mb-1">P6</span>
                        <span class="text-3xl font-bold text-white player-num">-</span>
                    </div>
                    <div id="pos-1" onclick="openSubModal(0)" class="flex-1 bg-white/10 rounded flex flex-col items-center justify-center border border-white/20 active:bg-white/30 transition-colors">
                        <span class="text-xs text-white/50 font-bold mb-1">P1</span>
                        <span class="text-3xl font-bold text-white player-num">-</span>
                    </div>
                </div>
            </div>
            
            <p class="text-zinc-500 text-xs mt-6 text-center">ポジションをタップして選手交代</p>
        </div>
    </div>

    <!-- Substitution Modal -->
    <div id="sub-modal" class="fixed inset-0 bg-black/95 z-[180] hidden p-6 flex flex-col items-center justify-center">
        <div class="max-w-xs w-full bg-zinc-900 border border-zinc-800 p-6 rounded-lg shadow-2xl overflow-hidden flex flex-col max-h-[70vh]">
            <h2 class="text-lg font-bold mb-4 text-white text-center">交代選手を選択</h2>
            <div id="bench-list" class="flex-1 overflow-y-auto space-y-2 pr-2">
                <!-- Bench players listed here -->
            </div>
            <button onclick="closeSubModal()" class="w-full bg-zinc-800 hover:bg-zinc-700 text-white font-bold py-3 rounded mt-4">キャンセル</button>
        </div>
    </div>

    <!-- Timeout Timer Modal -->
    <div id="timeout-timer-modal" class="fixed inset-0 bg-black/95 z-[190] hidden p-6 flex flex-col items-center justify-center select-none">
        <div class="max-w-sm w-full bg-zinc-900 border border-zinc-800 p-8 rounded-2xl shadow-2xl flex flex-col items-center relative overflow-hidden">
            <div class="absolute top-0 left-0 right-0 h-2 bg-zinc-800">
                <div id="timeout-timer-progress" class="h-full bg-yellow-500 transition-all duration-1000 w-full"></div>
            </div>
            <span class="text-xs font-bold text-yellow-500 tracking-widest uppercase mb-1 animate-pulse">TIMEOUT IN PROGRESS</span>
            <h2 id="timeout-timer-team" class="text-2xl font-black text-white mb-6 text-center truncate w-full">TEAM A</h2>
            
            <div class="relative w-40 h-40 flex items-center justify-center mb-8">
                <!-- Outer glow ring -->
                <div class="absolute inset-0 rounded-full border-4 border-zinc-800"></div>
                <!-- Countdown seconds -->
                <span id="timeout-timer-sec" class="text-6xl font-black text-yellow-400 tracking-tighter">30</span>
            </div>

            <button onclick="stopTimeoutTimer()" class="w-full bg-zinc-800 hover:bg-zinc-700 text-zinc-400 hover:text-white font-bold py-3 rounded-xl transition-all">スキップして試合再開</button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-24 left-1/2 -translate-x-1/2 bg-yellow-400 text-black px-6 py-2 rounded-full font-bold shadow-2xl opacity-0 transition-opacity pointer-events-none z-[200]">
        セットポイント！
    </div>

    <script>
        // --- State ---
        let state = {
            teamA: "TEAM A",
            teamB: "TEAM B",
            colorA: "#eab308",
            colorB: "#ffffff",
            scoreA: 0,
            scoreB: 0,
            setsA: 0,
            setsB: 0,
            toA: 0,
            toB: 0,
            currentSet: 1,
            maxSets: 3,
            targetPoints: 25,
            finalSetTarget: 15,
            maxTimeouts: 2,
            isCourtSwapped: false,
            actionLog: [], // { type, team, scoreA, scoreB, set }
            matchComplete: false,
            setHistory: [], // [{ set: 1, winner: 'A', scoreA: 25, scoreB: 23, log: [...] }]
            matchStartTime: Date.now(),
            timeoutDuration: 30, // タイムアウト時間（秒）
            // 追加分
            membersA: Array.from({length: 12}, (_, i) => ({ id: `A${i+1}`, number: i + 1, name: `Player A${i+1}` })),
            membersB: Array.from({length: 12}, (_, i) => ({ id: `B${i+1}`, number: i + 1, name: `Player B${i+1}` })),
            lineupA: ["A1", "A2", "A3", "A4", "A5", "A6"], // P1, P2, P3, P4, P5, P6
            lineupB: ["B1", "B2", "B3", "B4", "B5", "B6"],
            liberoA: null,
            liberoB: null,
            servingTeam: 'A',
            rotationLog: [] // { lineupA, lineupB, servingTeam }
        };

        const STORAGE_KEY = 'volleyball_score_state';
        const HISTORY_KEY = 'volleyball_match_history';

        // --- Init ---
        function init() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                state = JSON.parse(saved);
                if (!state.colorA) state.colorA = "#eab308";
                if (!state.colorB) state.colorB = "#ffffff";
                if (state.maxTimeouts === undefined) state.maxTimeouts = 2;
                if (!state.matchStartTime) state.matchStartTime = Date.now();
                
                // 追加分のプロパティ（メンバー・ローテーション関連）の初期化
                if (!state.membersA) {
                    state.membersA = Array.from({length: 12}, (_, i) => ({ id: `A${i+1}`, number: i + 1, name: `Player A${i+1}` }));
                    state.membersB = Array.from({length: 12}, (_, i) => ({ id: `B${i+1}`, number: i + 1, name: `Player B${i+1}` }));
                }
                if (!state.lineupA) state.lineupA = ["A1", "A2", "A3", "A4", "A5", "A6"];
                if (!state.lineupB) state.lineupB = ["B1", "B2", "B3", "B4", "B5", "B6"];
                if (state.liberoA === undefined) state.liberoA = null;
                if (state.liberoB === undefined) state.liberoB = null;
                if (!state.servingTeam) state.servingTeam = 'A';
                if (!state.rotationLog) state.rotationLog = [];
                
                updateUI();
            } else {
                applySettings(true); // Default init
            }
            
            // Sync settings input values with state
            document.getElementById('input-max-timeouts').value = state.maxTimeouts;

            registerPWA();
            keepScreenOn();
            startTimer();
        }

        let timerInterval;
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 1000);
            updateTimer();
        }
        function updateTimer() {
            if (state.matchComplete || !state.matchStartTime) return;
            const diffMs = Date.now() - state.matchStartTime;
            const mins = Math.floor(diffMs / 60000);
            document.getElementById('match-duration').textContent = mins;
        }

        // --- UI Updates ---
        function updateUI() {
            document.documentElement.style.setProperty('--color-a', state.colorA);
            document.documentElement.style.setProperty('--color-b', state.colorB);

            // Names
            const indA = document.getElementById('serve-indicator-a');
            const indB = document.getElementById('serve-indicator-b');
            if (indA) {
                indA.textContent = state.servingTeam === 'A' ? '🏐' : '';
                indA.style.display = state.servingTeam === 'A' ? 'block' : 'none';
            }
            if (indB) {
                indB.textContent = state.servingTeam === 'B' ? '🏐' : '';
                indB.style.display = state.servingTeam === 'B' ? 'block' : 'none';
            }
            document.getElementById('name-a').textContent = state.teamA;
            document.getElementById('name-b').textContent = state.teamB;
            // チーム名・カラーはメイン得点画面の専用モーダルで個別に設定可能
            document.getElementById('input-max-timeouts').value = state.maxTimeouts;
            document.getElementById('input-sets-format').value = state.maxSets;
            document.getElementById('input-target-points').value = state.targetPoints;
            document.getElementById('input-final-set-target').value = state.finalSetTarget;

            // Scores
            document.getElementById('score-a').textContent = String(state.scoreA).padStart(2, '0');
            document.getElementById('score-b').textContent = String(state.scoreB).padStart(2, '0');
            
            // Sets
            document.getElementById('sets-a').textContent = state.setsA;
            document.getElementById('sets-b').textContent = state.setsB;
            
            // Timeouts Indicators
            renderTimeouts('A');
            renderTimeouts('B');

            // Header Info
            document.getElementById('current-set-num').textContent = state.currentSet;

            // Court Swap
            const court = document.getElementById('main-court');
            const areaA = document.getElementById('area-a');
            const areaB = document.getElementById('area-b');
            const isLandscape = window.innerWidth > window.innerHeight;
            
            if (state.isCourtSwapped) {
                court.style.flexDirection = isLandscape ? 'row-reverse' : 'column-reverse';
                
                if (!isLandscape) {
                    areaA.style.flexDirection = 'column-reverse';
                    areaB.style.flexDirection = 'column';
                } else {
                    areaA.style.flexDirection = 'column';
                    areaB.style.flexDirection = 'column';
                }
            } else {
                court.style.flexDirection = isLandscape ? 'row' : 'column';

                if (!isLandscape) {
                    areaA.style.flexDirection = 'column';
                    areaB.style.flexDirection = 'column-reverse';
                } else {
                    areaA.style.flexDirection = 'column';
                    areaB.style.flexDirection = 'column';
                }
            }

            saveState();
            
            // 画面回転時などに、もし現在コート図モーダルが表示されていれば向きをリアルタイム更新する
            if (typeof currentCourtTeam !== 'undefined' && currentCourtTeam) {
                renderCourt(currentCourtTeam);
            }
        }

        function renderTimeouts(team) {
            const container = document.getElementById(team === 'A' ? 'to-indicator-a' : 'to-indicator-b');
            const max = state.maxTimeouts || 2;
            const used = team === 'A' ? state.toA : state.toB;
            const remain = Math.max(0, max - used);
            const color = team === 'A' ? state.colorA : state.colorB;
            
            let html = '';
            for (let i = 0; i < max; i++) {
                if (i < remain) {
                    // まだ使える（色が塗られた四角）
                    html += `<div class="w-6 h-4 sm:w-8 sm:h-5 rounded-sm shadow-md transition-all pointer-events-none" style="background-color: ${color};"></div>`;
                } else {
                    // 使用済み（枠だけの空の四角）
                    html += `<div class="w-6 h-4 sm:w-8 sm:h-5 rounded-sm bg-zinc-800/50 border border-zinc-700 transition-all opacity-40 pointer-events-none"></div>`;
                }
            }
            container.innerHTML = html;
        }

        function getCurrentTarget() {
            return state.currentSet === state.maxSets ? state.finalSetTarget : state.targetPoints;
        }

        // --- Game Logic ---
        function addPoint(team) {
            if (state.matchComplete) return;

            // モーダル画面が表示されている時は、背面コートのタップ判定を完全に無効化する
            const modals = ['settings-modal', 'reset-modal', 'timeline-modal', 'history-modal', 'member-modal', 'court-modal', 'sub-modal'];
            const isAnyModalOpen = modals.some(id => {
                const el = document.getElementById(id);
                return el && !el.classList.contains('hidden');
            });
            if (isAnyModalOpen) return;

            vibrate(50);
            
            const rotationOccurred = state.servingTeam !== team;

            state.actionLog.push({
                type: 'point',
                team: team,
                scoreA: state.scoreA,
                scoreB: state.scoreB,
                set: state.currentSet,
                servingTeam: state.servingTeam,
                rotationOccurred: rotationOccurred
            });

            // サイドアウト判定
            if (rotationOccurred) {
                state.servingTeam = team;
                rotateTeam(team);
            }

            if (team === 'A') state.scoreA++;
            else state.scoreB++;

            checkSetEnd();
            updateUI();
        }

        function rotateTeam(team) {
            const lineup = team === 'A' ? state.lineupA : state.lineupB;
            // P1(0) <- P2(1) <- P3(2) <- P4(3) <- P5(4) <- P6(5) <- P1(0)
            // 配列の先頭を取り出して末尾に追加することで、ポジションを時計回りにずらす
            const first = lineup.shift();
            lineup.push(first);
            
            state.rotationLog.push({
                set: state.currentSet,
                team: team,
                lineup: [...lineup],
                scoreA: state.scoreA,
                scoreB: state.scoreB
            });
        }

        function checkSetEnd() {
            const target = getCurrentTarget();
            const a = state.scoreA;
            const b = state.scoreB;

            if ((a >= target || b >= target) && Math.abs(a - b) >= 2) {
                const winner = a > b ? 'A' : 'B';
                finishSet(winner);
            } else if (a === target - 1 || b === target - 1) {
                showToast("セットポイント！");
            }
        }

        function finishSet(winner) {
            // Undo用にセット終了前の状態を記録
            state.actionLog.push({
                type: 'set_finish',
                winner: winner,
                scoreA: state.scoreA,
                scoreB: state.scoreB,
                toA: state.toA,
                toB: state.toB,
                currentSet: state.currentSet,
                setsA: state.setsA,
                setsB: state.setsB,
                isCourtSwapped: state.isCourtSwapped
            });

            if (winner === 'A') state.setsA++;
            else state.setsB++;

            state.setHistory.push({
                set: state.currentSet,
                winner: winner,
                scoreA: state.scoreA,
                scoreB: state.scoreB,
                log: [...state.actionLog.filter(l => l.set === state.currentSet)]
            });

            const matchWinnerNeeded = Math.ceil(state.maxSets / 2);
            if (state.setsA === matchWinnerNeeded || state.setsB === matchWinnerNeeded) {
                finishMatch(winner === 'A' ? state.teamA : state.teamB);
            } else {
                alert(`第${state.currentSet}セット終了！ 勝者: ${winner === 'A' ? state.teamA : state.teamB}`);
                state.currentSet++;
                state.scoreA = 0;
                state.scoreB = 0;
                state.toA = 0;
                state.toB = 0;
                swapCourts(true); // 自動のコートチェンジ
            }
        }

        function finishMatch(winnerName) {
            const matchHistory = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
            matchHistory.unshift({
                date: new Date().toLocaleString(),
                teamA: state.teamA,
                teamB: state.teamB,
                colorA: state.colorA,
                colorB: state.colorB,
                setsA: state.setsA,
                setsB: state.setsB,
                setHistory: JSON.parse(JSON.stringify(state.setHistory)),
                maxSets: state.maxSets,
                durationMinutes: Math.floor((Date.now() - state.matchStartTime) / 60000)
            });
            localStorage.setItem(HISTORY_KEY, JSON.stringify(matchHistory));

            alert(`試合終了！ 勝者: ${winnerName}\n\n[OK]を押すとスコアをリセットして次の試合を開始します。`);

            state.scoreA = 0;
            state.scoreB = 0;
            state.setsA = 0;
            state.setsB = 0;
            state.toA = 0;
            state.toB = 0;
            state.currentSet = 1;
            state.actionLog = [];
            state.setHistory = [];
            state.matchComplete = false;
            state.matchStartTime = Date.now();
            updateTimer();

            // メンバー・ローテーション関連のリセット
            state.lineupA = ["A1", "A2", "A3", "A4", "A5", "A6"];
            state.lineupB = ["B1", "B2", "B3", "B4", "B5", "B6"];
            state.liberoB = null;
            const fsEl = document.getElementById('input-first-serve');
            state.servingTeam = fsEl ? fsEl.value : 'A';
            state.rotationLog = [];

            updateUI();
        }

        function toggleServingTeam() {
            if (state.matchComplete) return;
            vibrate(30);
            state.servingTeam = state.servingTeam === 'A' ? 'B' : 'A';
            updateUI();
        }

        function undo() {
            if (state.actionLog.length === 0) return;
            vibrate(30);
            
            const last = state.actionLog.pop();
            if (last.type === 'point') {
                state.scoreA = last.scoreA;
                state.scoreB = last.scoreB;
                state.servingTeam = last.servingTeam;
                
                if (last.rotationOccurred) {
                    // 回転を戻す
                    const lineup = last.team === 'A' ? state.lineupA : state.lineupB;
                    const end = lineup.pop();
                    lineup.unshift(end);
                    if (state.rotationLog.length > 0) state.rotationLog.pop();
                }
            } else if (last.type === 'timeout') {
                if (last.team === 'A') state.toA--;
                else state.toB--;
            } else if (last.type === 'substitution') {
                const lineup = last.team === 'A' ? state.lineupA : state.lineupB;
                lineup[last.posIdx] = last.outPlayerId;
            } else if (last.type === 'set_finish') {
                state.scoreA = last.scoreA;
                state.scoreB = last.scoreB;
                state.toA = last.toA;
                state.toB = last.toB;
                state.currentSet = last.currentSet;
                state.setsA = last.setsA;
                state.setsB = last.setsB;
                state.isCourtSwapped = last.isCourtSwapped;
                state.setHistory.pop();
            } else if (last.type === 'swap_courts') {
                state.isCourtSwapped = last.isCourtSwapped;
            }
            updateUI();
        }

        function swapCourts(isAuto = false) {
            if (!isAuto) {
                state.actionLog.push({
                    type: 'swap_courts',
                    isCourtSwapped: state.isCourtSwapped
                });
            }
            state.isCourtSwapped = !state.isCourtSwapped;
            updateUI();
        }

        function requestTimeout(team) {
            if (state.matchComplete) return;
            
            const teamName = team === 'A' ? state.teamA : state.teamB;
            const currentTo = team === 'A' ? state.toA : state.toB;
            const max = state.maxTimeouts || 2;
            
            if (currentTo >= max) {
                if(!confirm(`${teamName} は既に${max}回タイムアウトを取っています。追加しますか？`)) return;
            } else {
                if(!confirm(`${teamName} のタイムアウトを取りますか？`)) return;
            }

            vibrate(50);
            state.actionLog.push({
                type: 'timeout',
                team: team,
                scoreA: state.scoreA,
                scoreB: state.scoreB,
                set: state.currentSet
            });
            if (team === 'A') state.toA++;
            else state.toB++;
            saveState();
            updateUI();
            startTimeoutTimer(team);
        }

        // --- Settings ---
        function applySettings(isInit = false) {
            // チーム名・色は設定画面では入力しない
            state.maxSets = parseInt(document.getElementById('input-sets-format').value);
            state.targetPoints = parseInt(document.getElementById('input-target-points').value);
            state.finalSetTarget = parseInt(document.getElementById('input-final-set-target').value);
            state.maxTimeouts = parseInt(document.getElementById('input-max-timeouts').value);
            const durationEl = document.getElementById('input-timeout-duration');
            if (durationEl) state.timeoutDuration = parseInt(durationEl.value) || 30;
            
            if (isInit) {
                state.scoreA = 0;
                state.scoreB = 0;
                state.setsA = 0;
                state.setsB = 0;
                state.toA = 0;
                state.toB = 0;
                state.currentSet = 1;
                state.actionLog = [];
                state.setHistory = [];
                state.matchComplete = false;
                state.matchStartTime = Date.now();
                updateTimer();

                // メンバー・ローテーション関連の初期化
                state.membersA = Array.from({length: 14}, (_, i) => ({ id: `A${i+1}`, number: i + 1, name: `Player A${i+1}` }));
                state.membersB = Array.from({length: 14}, (_, i) => ({ id: `B${i+1}`, number: i + 1, name: `Player B${i+1}` }));
                state.lineupA = ["A1", "A2", "A3", "A4", "A5", "A6"];
                state.lineupB = ["B1", "B2", "B3", "B4", "B5", "B6"];
                state.liberoA = null;
                state.liberoB = null;
                state.servingTeam = 'A'; // デフォルトは常に左/上のチーム
                state.rotationLog = [];
            } else {
                toggleSettings();
            }
            updateUI();
        }

        function resetStateForNewMatch() {
            state.scoreA = 0;
            state.scoreB = 0;
            state.setsA = 0;
            state.setsB = 0;
            state.toA = 0;
            state.toB = 0;
            state.currentSet = 1;
            state.actionLog = [];
            state.setHistory = [];
            state.matchComplete = false;
            state.matchStartTime = Date.now();
            if (typeof updateTimer === 'function') updateTimer();

            // メンバー・ローテーション関連のリセット
            state.lineupA = ["A1", "A2", "A3", "A4", "A5", "A6"];
            state.lineupB = ["B1", "B2", "B3", "B4", "B5", "B6"];
            state.liberoA = null;
            state.liberoB = null;
            state.servingTeam = 'A';
            state.rotationLog = [];

            // 入力欄の最新設定も反映する
            // チーム設定は保持する
            state.maxSets = parseInt(document.getElementById('input-sets-format').value);
            state.targetPoints = parseInt(document.getElementById('input-target-points').value);
            state.finalSetTarget = parseInt(document.getElementById('input-final-set-target').value);
            state.maxTimeouts = parseInt(document.getElementById('input-max-timeouts').value);
            const durationEl = document.getElementById('input-timeout-duration');
            if (durationEl) state.timeoutDuration = parseInt(durationEl.value) || 30;

            document.getElementById('settings-modal').classList.add('hidden');
            updateUI();
        }

        function finishAndStartNewMatch() {
            toggleResetMenu();

            // 進行中のセットがあれば記録する
            if (state.scoreA > 0 || state.scoreB > 0 || state.actionLog.length > 0) {
                let currentSetWinner = 'Draw';
                if (state.scoreA > state.scoreB) currentSetWinner = 'A';
                else if (state.scoreB > state.scoreA) currentSetWinner = 'B';
                
                state.setHistory.push({
                    set: state.currentSet,
                    winner: currentSetWinner,
                    scoreA: state.scoreA,
                    scoreB: state.scoreB,
                    log: [...state.actionLog.filter(l => l.set === state.currentSet)]
                });
                
                if (currentSetWinner === 'A') state.setsA++;
                else if (currentSetWinner === 'B') state.setsB++;
            }

            // 何もデータがない（全く進んでいない）場合は記録しない
            const hasData = state.setHistory.length > 0 || state.setsA > 0 || state.setsB > 0;
            if (hasData) {
                const matchHistory = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
                matchHistory.unshift({
                    date: new Date().toLocaleString(),
                    teamA: state.teamA,
                    teamB: state.teamB,
                    colorA: state.colorA,
                    colorB: state.colorB,
                    setsA: state.setsA,
                    setsB: state.setsB,
                    setHistory: JSON.parse(JSON.stringify(state.setHistory)),
                    maxSets: state.maxSets,
                    durationMinutes: Math.floor((Date.now() - state.matchStartTime) / 60000)
                });
                localStorage.setItem(HISTORY_KEY, JSON.stringify(matchHistory));
                showToast("試合を記録しました");
            } else {
                showToast("スコアがないため記録しませんでした");
            }

            resetStateForNewMatch();
        }

        function startNewMatch() {
            toggleResetMenu();
            resetStateForNewMatch();
        }

        // --- Timeline View ---
        function renderTimeline(setLog, teamA, teamB, colorA, colorB, currentScoreA, currentScoreB, setInProgress) {
            const container = document.createElement('div');
            container.className = "py-4 border-b border-zinc-800/50 mb-4";

            let aScore = 0;
            let bScore = 0;
            let aTO = 0;
            let bTO = 0;
            
            const columns = [];
            
            setLog.forEach(action => {
                if (action.type === 'point') {
                    if (action.team === 'A') aScore++;
                    else bScore++;
                    columns.push({
                        type: 'point',
                        team: action.team,
                        val: action.team === 'A' ? aScore : bScore
                    });
                } else if (action.type === 'timeout') {
                    if (action.team === 'A') aTO++;
                    else bTO++;
                    columns.push({
                        type: 'timeout',
                        team: action.team,
                        val: action.team === 'A' ? aTO : bTO
                    });
                }
            });

            const finalA = setInProgress ? currentScoreA : aScore;
            const finalB = setInProgress ? currentScoreB : bScore;

            let htmlA = `<div class="flex items-center" style="min-width: max-content;">`;
            let htmlB = `<div class="flex items-center mt-1.5" style="min-width: max-content;">`;

            // Final score box (leftmost)
            htmlA += `<div class="w-12 h-10 flex items-center justify-center font-bold text-xl rounded mr-4 color-box" style="background: ${colorA};">${finalA}</div>`;
            htmlB += `<div class="w-12 h-10 flex items-center justify-center font-bold text-xl rounded mr-4 color-box" style="background: ${colorB};">${finalB}</div>`;

            // Timeline items
            columns.forEach(col => {
                if (col.type === 'point') {
                    if (col.team === 'A') {
                        htmlA += `<div class="w-7 h-7 flex items-center justify-center mx-0.5 rounded color-box text-sm" style="background: ${colorA};">${col.val}</div>`;
                        htmlB += `<div class="w-7 h-7 mx-0.5"></div>`;
                    } else {
                        htmlA += `<div class="w-7 h-7 mx-0.5"></div>`;
                        htmlB += `<div class="w-7 h-7 flex items-center justify-center mx-0.5 rounded color-box text-sm" style="background: ${colorB};">${col.val}</div>`;
                    }
                } else if (col.type === 'timeout') {
                    if (col.team === 'A') {
                        htmlA += `<div class="w-7 h-7 flex items-center justify-center mx-0.5 color-box t-box text-[11px]" style="background: ${colorA}; border: 1.5px solid #000;">T${col.val}</div>`;
                        htmlB += `<div class="w-7 h-7 mx-0.5"></div>`;
                    } else {
                        htmlA += `<div class="w-7 h-7 mx-0.5"></div>`;
                        htmlB += `<div class="w-7 h-7 flex items-center justify-center mx-0.5 color-box t-box text-[11px]" style="background: ${colorB}; border: 1.5px solid #000;">T${col.val}</div>`;
                    }
                }
            });

            htmlA += `</div>`;
            htmlB += `</div>`;

            container.innerHTML = `<div class="overflow-x-auto pb-2 timeline-container">${htmlA}${htmlB}</div>`;
            return container;
        }

        function showCurrentTimeline() {
            const content = document.getElementById('timeline-content');
            content.innerHTML = "";
            
            const allSets = [...state.setHistory];
            if (!state.matchComplete) {
                allSets.push({
                    set: state.currentSet,
                    scoreA: state.scoreA,
                    scoreB: state.scoreB,
                    log: state.actionLog.filter(l => l.set === state.currentSet)
                });
            }

            const matchScoreHeader = document.createElement('div');
            matchScoreHeader.className = "flex items-center justify-center gap-4 mb-8 text-xl font-bold bg-[#1a1a1a] sticky top-0 py-4 z-10";
            matchScoreHeader.innerHTML = `
                <span style="color: ${state.colorA}">${state.teamA}</span>
                <span class="bg-zinc-800 px-3 py-1 rounded text-white">${state.setsA}</span>
                <span class="text-zinc-500">-</span>
                <span class="bg-zinc-800 px-3 py-1 rounded text-white">${state.setsB}</span>

            content.appendChild(matchScoreHeader);

            });

        function ensureMemberState() {
            if (!state.membersA || !Array.isArray(state.membersA)) {
                state.membersA = Array.from({length: 14}, (_, i) => ({ id: `A${i+1}`, number: i + 1, name: `Player A${i+1}` }));
            }
            if (!state.membersB || !Array.isArray(state.membersB)) {

            }
            if (!state.lineupA || !Array.isArray(state.lineupA)) {
                state.lineupA = ["A1", "A2", "A3", "A4", "A5", "A6"];
            }
            if (!state.lineupB || !Array.isArray(state.lineupB)) {
                state.lineupB = ["B1", "B2", "B3", "B4", "B5", "B6"];
            }
        }

        function renderCourt(team) {
            ensureMemberState();
            const teamName = team === 'A' ? (state.teamA || "TEAM A") : (state.teamB || "TEAM B");
            const lineup = team === 'A' ? state.lineupA : state.lineupB;
            const members = team === 'A' ? state.membersA : state.membersB;

            const labelEl = document.getElementById('court-team-label');
            if (labelEl) {
                labelEl.textContent = teamName;
                labelEl.style.color = team === 'A' ? (state.colorA || "#eab308") : (state.colorB || "#ffffff");
            }

            // ポジション配列: P1, P2, P3, P4, P5, P6 (idx 0 to 5)
            if (Array.isArray(lineup)) {
                lineup.forEach((playerId, idx) => {
                    const posNum = idx + 1;
                    const el = document.getElementById(`pos-${posNum}`);
                    if (!el) return;
                    const numSpan = el.querySelector('.player-num');
                    if (!numSpan) return;
                    
                    let player = null;
                    if (Array.isArray(members)) {
                        player = members.find(m => m.id === playerId);
                        if (!player) {
                            const match = playerId ? String(playerId).match(/[ABM](\d+)/) : null;
                            const pIdx = match ? parseInt(match[1]) - 1 : idx;
                            player = members[pIdx] || members[idx];
                        }
                    }
                    numSpan.textContent = player ? player.number : '-';
                });
            }

            // 動的レイアウトの方向切り替え（実際のネットを挟んだ向きへ調整）
            const container = document.getElementById('court-grid-container');
            const frontRow = document.getElementById('court-front-row');
            const backRow = document.getElementById('court-back-row');
            const netLine = document.getElementById('court-net-line');

            if (container && frontRow && backRow && netLine) {
                const isLandscape = window.innerWidth > window.innerHeight;
                // 画面上の前半（左側または上側）に配置されているかどうか
                const isFirstHalf = state.isCourtSwapped ? (team === 'B') : (team === 'A');

                if (isLandscape) {
                    // 横画面：左右分割。ネットは画面中央の縦線。
                    container.style.flexDirection = 'row';
                    
                    netLine.style.width = '3px';
                    netLine.style.height = 'auto';
                    netLine.style.margin = '0 6px';

                    if (isFirstHalf) {
                        // 左側のチーム：ネットは右側。左から 後衛 ➔ ネット ➔ 前衛
                        backRow.style.order = '1';
                        netLine.style.order = '2';
                        frontRow.style.order = '3';
                        // レフト/ライトの関係を維持し時計回りに見せるため、上から P5/P4、下が P1/P2 とする
                        frontRow.style.flexDirection = 'column';
                        backRow.style.flexDirection = 'column';
                    } else {
                        // 右側のチーム：ネットは左側。左から 前衛 ➔ ネット ➔ 後衛
                        frontRow.style.order = '1';
                        netLine.style.order = '2';
                        backRow.style.order = '3';
                        // ネットの向き（左側）に対して正しく時計回りに見せるため、列内の上下順序を反転させる
                        frontRow.style.flexDirection = 'column-reverse';
                        backRow.style.flexDirection = 'column-reverse';
                    }
                } else {
                    // 縦画面：上下分割。ネットは画面中央の横線。
                    container.style.flexDirection = 'column';
                    
                    netLine.style.width = 'auto';
                    netLine.style.height = '3px';
                    netLine.style.margin = '6px 0';

                    if (isFirstHalf) {
                        // 上側のチーム：ネットは下側。上から 後衛 ➔ ネット ➔ 前衛
                        backRow.style.order = '1';
                        netLine.style.order = '2';
                        frontRow.style.order = '3';
                        // 向こう側のコートを記録席から見た視点として、左右（レフト/ライト）を反転させることで時計回りに見せる
                        frontRow.style.flexDirection = 'row-reverse';
                        backRow.style.flexDirection = 'row-reverse';
                    } else {
                        // 下側のチーム：ネットは上側。上から 前衛 ➔ ネット ➔ 後衛
                        frontRow.style.order = '1';
                        netLine.style.order = '2';
                        backRow.style.order = '3';
                        // 通常視点（手前側コート）なので、左から右へ通常の順序とする
                        frontRow.style.flexDirection = 'row';
                        backRow.style.flexDirection = 'row';
                    }
                }
            }
        }

        function openSubModal(posIdx) {
            ensureMemberState();
            currentSubPosIdx = posIdx;
            const team = currentCourtTeam;
            const lineup = team === 'A' ? state.lineupA : state.lineupB;
            const members = team === 'A' ? state.membersA : state.membersB;
            
            // ベンチメンバー = lineupに含まれていない全登録メンバー
            const bench = Array.isArray(members) ? members.filter(m => !(Array.isArray(lineup) && lineup.includes(m.id))) : [];
            
            const list = document.getElementById('bench-list');
            if (bench.length === 0) {
                list.innerHTML = `<div class="text-zinc-500 text-center py-4 text-sm">控え選手がいません</div>`;
            } else {
                list.innerHTML = bench.map(m => `
                    <button onclick="substitute('${m.id}')" class="w-full bg-zinc-800 hover:bg-zinc-700 text-white p-3 rounded flex justify-between items-center transition-colors">
                        <span class="font-bold text-lg w-10">${m.number}</span>
                        <span class="flex-1 text-left truncate mx-2 text-sm">${m.name}</span>
                        <span class="text-blue-400 text-xs font-bold">交代 ➔</span>
                    </button>
                `).join('');
            }
            
            document.getElementById('sub-modal').classList.remove('hidden');
        }

        function closeSubModal() {
            document.getElementById('sub-modal').classList.add('hidden');
            currentSubPosIdx = null;
        }

        function substitute(benchPlayerId) {
            if (currentSubPosIdx === null || !currentCourtTeam) return;
            
            const team = currentCourtTeam;
            const lineup = team === 'A' ? state.lineupA : state.lineupB;
            const oldPlayerId = lineup[currentSubPosIdx];
            
            // 交代実行
            lineup[currentSubPosIdx] = benchPlayerId;
            
            state.actionLog.push({
                type: 'substitution',
                team: team,
                posIdx: currentSubPosIdx,
                outPlayerId: oldPlayerId,
                inPlayerId: benchPlayerId,
                scoreA: state.scoreA,
                scoreB: state.scoreB,
                set: state.currentSet
            });
            
            updateUI();
            renderCourt(team);
            closeSubModal();
            showToast("選手交代しました");
        }

        function saveMasterTeam() {
            const nameVal = document.getElementById('master-team-name').value.trim();
            if (!nameVal) {
                alert("チーム名を入力してください。");
                return;
            }
            const colorVal = document.getElementById('master-team-color').value;

            let presets = JSON.parse(localStorage.getItem(PRESET_TEAMS_KEY) || '[]');
            
            const newPreset = {
                id: masterEditOriginalName ? (presets.find(p => p.name === masterEditOriginalName)?.id || `preset_${Date.now()}`) : `preset_${Date.now()}`,
                name: nameVal,
                color: colorVal,
                members: JSON.parse(JSON.stringify(masterEditMembers))
            };

            const existingIdx = presets.findIndex(p => p.name === nameVal);

            if (masterEditOriginalName && masterEditOriginalName !== nameVal) {
                const oldIdx = presets.findIndex(p => p.name === masterEditOriginalName);
                if (oldIdx >= 0) {
                    presets[oldIdx] = newPreset;
                } else {
                    presets.push(newPreset);
                }
            } else if (existingIdx >= 0) {
                presets[existingIdx] = newPreset;
            } else {
                presets.push(newPreset);
            }

            localStorage.setItem(PRESET_TEAMS_KEY, JSON.stringify(presets));
            showToast(`チームマスター「${nameVal}」を保存しました`);
            
            if (state.teamA === masterEditOriginalName || state.teamA === nameVal) {
                state.teamA = nameVal;
                state.colorA = colorVal;
                state.membersA = Array.from({length: 14}, (_, i) => {

                        id: `A${i+1}`,

                        name: mem ? mem.name : `Player A${i+1}`

                state.lineupA = ["A1", "A2", "A3", "A4", "A5", "A6"];
            }
            if (state.teamB === masterEditOriginalName || state.teamB === nameVal) {
                state.teamB = nameVal;
                state.colorB = colorVal;
                state.membersB = Array.from({length: 14}, (_, i) => {
                    const mem = masterEditMembers[i];
                    return {
                        id: `B${i+1}`,
                        number: mem ? mem.number : (i + 1),
                        name: mem ? mem.name : `Player B${i+1}`
                    };
                });
                state.lineupB = ["B1", "B2", "B3", "B4", "B5", "B6"];

            saveState();
            updateUI();
            
            masterEditOriginalName = nameVal;
            const sel = document.getElementById('master-team-select');
            sel.innerHTML = `<option value="">-- 新規チームを作成 --</option>` +

        // --- Timeout Timer ---
        let timeoutTimerInterval = null;
        let timeoutRemainingSeconds = 0;

        function startTimeoutTimer(team) {
            const duration = state.timeoutDuration || 30;
            timeoutRemainingSeconds = duration;
            
            const modal = document.getElementById('timeout-timer-modal');
            const teamLabel = document.getElementById('timeout-timer-team');
            const secLabel = document.getElementById('timeout-timer-sec');
            const progress = document.getElementById('timeout-timer-progress');
            
            const teamName = team === 'A' ? state.teamA : state.teamB;
            const teamColor = team === 'A' ? state.colorA : state.colorB;
            
            if (teamLabel) {
                teamLabel.textContent = `${teamName} タイムアウト`;
                teamLabel.style.color = teamColor || "#ffffff";
            }
            if (secLabel) secLabel.textContent = timeoutRemainingSeconds;
            if (progress) {
                progress.style.transitionDuration = '0s';
                progress.style.width = '100%';
                setTimeout(() => {
                    progress.style.transitionDuration = '1s';
                }, 50);
            }
            
            if (modal) modal.classList.remove('hidden');
            
            if (timeoutTimerInterval) clearInterval(timeoutTimerInterval);
            
            timeoutTimerInterval = setInterval(() => {
                timeoutRemainingSeconds--;
                if (secLabel) secLabel.textContent = timeoutRemainingSeconds;
                if (progress) {
                    const pct = (timeoutRemainingSeconds / duration) * 100;
                    progress.style.width = `${pct}%`;
                }
                
                if (timeoutRemainingSeconds <= 0) {
                    vibrate(1000);
                    stopTimeoutTimer();
                    showToast("タイムアウト終了");
                }
            }, 1000);
        }

        function stopTimeoutTimer() {
            if (timeoutTimerInterval) {
                clearInterval(timeoutTimerInterval);
                timeoutTimerInterval = null;
            }
            const modal = document.getElementById('timeout-timer-modal');
            if (modal) modal.classList.add('hidden');
        }

        // --- PWA Support ---
        function registerPWA() {
            const manifest = {
                "name": "Volleyball Scorebook",
                "short_name": "VB Score",
                "start_url": ".",
                "display": "standalone",
                "background_color": "#1a1a1a",
                "theme_color": "#1a1a1a",
                "icons": [
                    {
                        "src": "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231a1a1a'/%3E%3Ctext y='75' x='10' font-family='Arial' font-size='70' fill='yellow'%3EVB%3C/text%3E%3C/svg%3E",
                        "sizes": "192x192",
                        "type": "image/svg+xml"
                    }
                ]
            };
            const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
            const manifestURL = URL.createObjectURL(manifestBlob);
            const link = document.createElement('link');
            link.rel = 'manifest';
            link.href = manifestURL;
            document.head.appendChild(link);

            if ('serviceWorker' in navigator) {
                const swCode = `
                    self.addEventListener('install', e => self.skipWaiting());
                    self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));
                `;
                const swBlob = new Blob([swCode], {type: 'application/javascript'});
                const swURL = URL.createObjectURL(swBlob);
                navigator.serviceWorker.register(swURL).catch(console.error);
            }
        }

        async function shareTimelineAsImage(containerId) {
            if (typeof html2canvas === 'undefined') {
                alert("画像化ライブラリの読み込みに失敗しました。");
                return;
            }

            const container = document.getElementById(containerId);
            if (!container) return;

            const timelineContainers = container.querySelectorAll('.timeline-container');
            const originalStyles = [];
            let maxWidth = container.offsetWidth;

            // 各行をスクロールではなく全体幅に広げる
            timelineContainers.forEach((tc) => {
                originalStyles.push({
                    el: tc,
                    overflowX: tc.style.overflowX,
                    width: tc.style.width
                });
                tc.style.overflowX = 'visible';
                tc.style.width = 'max-content';
                if (tc.scrollWidth > maxWidth) maxWidth = tc.scrollWidth;
            });

            const origContainerStyle = {
                width: container.style.width,
                overflowY: container.style.overflowY,
                overflowX: container.style.overflowX,
                height: container.style.height
            };
            
            // 親コンテナも広げる
            container.style.width = maxWidth + 40 + 'px';
            container.style.height = 'max-content';
            container.style.overflowY = 'visible';
            container.style.overflowX = 'visible';

            try {
                // 少し待ってから描画（スタイルの反映待ち）
                await new Promise(r => setTimeout(r, 100));
                
                const canvas = await html2canvas(container, {
                    backgroundColor: '#1a1a1a',
                    scale: 2,
                    windowWidth: maxWidth + 40
                });

                canvas.toBlob(async (blob) => {
                    const file = new File([blob], 'timeline.png', { type: 'image/png' });
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        try {
                            await navigator.share({
                                title: 'バレーボール スコア・タイムライン',
                                files: [file]
                            });
                        } catch (err) {
                            if (err.name !== 'AbortError') alert("共有に失敗しました: " + err.message);
                        }
                    } else {
                        // Web Share API非対応またはPC等の場合はダウンロード
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = 'timeline.png';
                        a.click();
                        URL.revokeObjectURL(url);
                    }
                });
            } catch (err) {
                alert("画像の生成に失敗しました: " + err.message);
            } finally {
                // スタイルを元に戻す
                container.style.width = origContainerStyle.width;
                container.style.height = origContainerStyle.height;
                container.style.overflowY = origContainerStyle.overflowY;
                container.style.overflowX = origContainerStyle.overflowX;
                originalStyles.forEach(orig => {
                    orig.el.style.overflowX = orig.overflowX;
                    orig.el.style.width = orig.width;
                });
            }
        }

        window.addEventListener('resize', updateUI);
        init();
    </script>
</body>
